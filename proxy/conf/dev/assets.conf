location /profile/api/v1/ {
	alias C:/Users/jongg/IdeaProjects/Summary/proxy/assets/profile/default/;
	access_log off;
	expires 30d;
	add_header Cache-Control "public";
	add_header Access-Allow-Origin *;
	include mime.types;
}

location /images/api/v1/ {
	alias C:/Users/jongg/IdeaProjects/Summary/proxy/assets/images/;
	access_log off;
	expires 30d;
	add_header Cache-Control "public";
	add_header Access-Allow-Origin *;
	include mime.types;
}
