# Config Client Global Properties

logging:
  level:
    root: INFO

eureka:
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}"
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:18761/eureka}"
